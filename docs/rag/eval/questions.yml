# du forum, comme le premier lot de 13 (confirmé bon le 12/09).
# Couvrir : définitions/technique de fabrication, avis marques, entretien,
# achat/occasion, pointure/largeur, types de chaussures, vie du forum,
# megathreads (dilution), grain post (réponse dans un post précis),
# hors-sujet (attendu : abstention → aucun golden).

