# === K. Corpus étendu (généré par template, échelle) =============================
# Sourcé par mining large (toutes catégories + tous les tags marques de la base
# locale, 13/09/2026) : question = titre réel si déjà formulé comme une question,
# sinon templates par famille de catégorie (souliers/entretien/vêtements/
# accessoires/bons plans/art de vivre/vie du forum/comptoir). Contrairement aux
# sections A-J (curées à la main, goldens vérifiés par pooling), ce bloc n'a PAS
# de curation manuelle poussée : golden = le topic source lui-même (single-topic,
# pas d'union multi-fils). Sert à mesurer la robustesse des configs sur un grand
# volume, pas à documenter des cas fins comme A-J. Tous les topic_ids vérifiés
# existants en base (cf. commit).

